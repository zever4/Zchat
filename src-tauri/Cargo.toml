[package]
name = "zchat-desktop"
description = "Desktop client for the Zchat messenger"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[features]
# Kept separate from distributable builds until desktop E2EE acceptance.
experimental-e2ee = ["rust-processor/e2ee", "dep:uuid", "dep:base64", "dep:tempfile", "dep:windows"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.4", features = [] }
rust-processor = { path = "../rust-processor", default-features = false, features = ["compression"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
zeroize = "1.9.1"
uuid = { version = "1.28.0", features = ["v4"], optional = true }
base64 = { version = "0.22.1", optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"], optional = true }
