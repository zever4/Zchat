<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zchat Desktop - Сервер недоступен</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body>
  <div class="shell stack">
    <div>
      <div class="eyebrow">Tauri Desktop</div>
      <h1>Не удалось открыть сервер</h1>
      <p>
        Desktop-приложение запустилось, но по текущему адресу Zchat-сервер не ответил.
        Проверьте, что сервер доступен, или поменяйте его адрес в настройках.
      </p>
    </div>

    <div class="card stack">
      <div class="meta">
        <div class="meta-row">
          <span>Текущий сервер</span>
          <span class="mono" id="serverUrl">...</span>
        </div>
        <div class="meta-row">
          <span>Последняя ошибка</span>
          <span class="mono" id="errorDescription">...</span>
        </div>
      </div>
      <div id="status" class="status"></div>
      <div class="actions">
        <button class="btn btn-primary" id="retryBtn">Повторить подключение</button>
        <button class="btn" id="settingsBtn">Настройки сервера</button>
        <button class="btn btn-danger" id="browserBtn">Открыть в браузере</button>
      </div>
    </div>
  </div>

  <script src="./tauri-api.js"></script>
  <script src="./offline.js"></script>
</body>
</html>
