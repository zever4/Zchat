<header class="desktop-titlebar" id="desktopTitlebar" aria-label="Окно Zchat">
  <div class="desktop-titlebar-drag" id="desktopTitlebarDrag">
    <span class="desktop-titlebar-logo" aria-hidden="true">Z</span>
    <span class="desktop-titlebar-name">Zchat</span>
    <span id="desktopWindowStatus" class="desktop-window-status" role="status"></span>
  </div>
  <button type="button" class="desktop-window-button desktop-server-settings" id="desktopServerSettings" title="Настройки сервера (Ctrl+,)" aria-label="Настройки сервера">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button type="button" class="desktop-window-button" id="desktopMinimize" title="Свернуть" aria-label="Свернуть">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg>
  </button>
  <button type="button" class="desktop-window-button" id="desktopMaximize" title="Развернуть" aria-label="Развернуть">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect class="desktop-maximize-glyph" x="3.5" y="3.5" width="9" height="9"/><path class="desktop-restore-glyph" d="M5.5 5.5v-3h8v8h-3m-8-5h8v8h-8z"/></svg>
  </button>
  <button type="button" class="desktop-window-button desktop-window-close" id="desktopClose" title="Закрыть" aria-label="Закрыть">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg>
  </button>
</header>
