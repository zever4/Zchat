global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: zchat-backend
    static_configs:
      - targets: ["server:8080"]
  - job_name: zchat-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  # The target is DOWN when compose.calls.yaml is not enabled. The calls
  # dashboard distinguishes this expected state using zchat_calls_enabled.
  - job_name: zchat-livekit
    static_configs:
      - targets: ["livekit:6789"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(go_.*|process_.*|livekit_(room_total|participant_total|track_published_total|track_subscribed_total|packet_total|packet_bytes|packet_loss_total|nack_total|pli_total|fir_total|rtt_ms_.*|jitter_us_.*))'
        action: keep
  - job_name: zchat-lab-resources
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
