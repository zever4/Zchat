worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 55m;
    client_header_timeout 5s;
    client_body_timeout 30s;
    send_timeout 60s;

    # Docker DNS: optional LiveKit need not exist when the basic chat starts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Never log request lines, URLs, query strings, headers, or bodies. Even a
    # normalized URI can contain credentials, so use fixed route categories.
    map $uri $safe_route {
        default static;
        /ws websocket;
        /health health;
        /metrics metrics;
        ~^/api/ api;
        ~^/uploads/ attachment;
        ~^/rtc/ call;
    }
    log_format safe escape=json
        '{"time":"$time_iso8601","route":"$log_route",'
        '"method":"$request_method","status":$status,'
        '"bytes":$body_bytes_sent,"seconds":$request_time,'
        '"upstream_status":"$upstream_status"}';
    access_log /dev/stdout safe;

    server {
        listen 80;
        # Evaluate before the /rtc/ URI rewrite so log categories stay stable.
        set $log_route $safe_route;
        # nginx error messages can embed the entire request/upstream URL.
        # Keep startup errors above; diagnose requests using safe status logs.
        error_log /dev/null;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 70s;
        proxy_send_timeout 35s;
        # Let Go enforce receive deadlines and auth before parsing uploads;
        # avoid storing private responses in nginx temporary files.
        proxy_request_buffering off;
        proxy_buffering off;

        # Prometheus scrapes server:8080 directly on the private Docker network.
        location = /metrics { return 404; }
        location / {
            set $chat_backend server:8080;
            proxy_pass http://$chat_backend;
        }
        location /rtc/ {
            set $call_backend server:8080;
            proxy_pass http://$call_backend;
            proxy_read_timeout 86400s;
        }
    }
}
