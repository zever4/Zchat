# Opt-in LiveKit stack; defaults to loopback. See development.md for Firefox/ICE.
# docker compose -f compose.yaml -f compose.calls.yaml up -d --build
services:
  server:
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    restart: unless-stopped
    ports:
      - "${LIVEKIT_MEDIA_BIND_IP:-127.0.0.1}:7881:7881" # ICE TCP fallback
      - "${LIVEKIT_MEDIA_BIND_IP:-127.0.0.1}:7882:7882/udp" # ICE UDP mux
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
